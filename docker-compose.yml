version: '3.8'

services:
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: fluxi_dev
    ports:
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fluxi
      POSTGRES_USER: fluxi
      POSTGRES_PASSWORD: fluxi_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxi -d fluxi"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fluxi
      MINIO_ROOT_PASSWORD: fluxi_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  casdoor:
    image: casbin/casdoor:latest
    ports:
      - "8000:8000"
    environment:
      driverName: postgres
      dataSourceName: "user=fluxi password=fluxi_dev host=postgres port=5432 dbname=casdoor sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  arango_data:
  pg_data:
  valkey_data:
  minio_data:
